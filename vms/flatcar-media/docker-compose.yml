services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    hostname: gluetun
    mem_limit: 256m
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "com.centurylinklabs.watchtower.scope=weekly"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${QBITTORRENT_PORT}:8080" # qbittorrent web UI
      - "${SABNZBD_PORT}:7777" # sabnzbd web UI
      - "${PROWLARR_PORT}:9696" # prowlarr web UI
      - "6881:6881" # qbittorrent peer port
      - "6881:6881/udp" # qbittorrent peer port UDP
      - "8001:8000" # gluetun control server (for port forward info)
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      - SERVER_COUNTRIES=${VPN_COUNTRY:-Netherlands}
      - TZ=${TZ}
      - PUBLICIP_PERIOD=12h
    secrets:
      - wireguard_private_key
      - wireguard_addresses
    volumes:
      - ${CONFIG_ROOT}/gluetun:/gluetun
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    hostname: flaresolverr
    mem_limit: 256m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "${FLARESOLVERR_PORT}:8191"
    volumes:
      - ${CONFIG_ROOT}/flaresolverr:/config
      - /srv/docker/resolv.conf:/etc/resolv.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    mem_limit: 256m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
    healthcheck:
      # Use root path so health check stays auth-free
      test: ["CMD", "curl", "-f", "http://localhost:9696/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
      - "com.centurylinklabs.watchtower.scope=weekly"
    mem_limit: 512m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
      - WEBUI_PORT=8080
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - type: bind
        source: ${DOWNLOADS_ROOT}
        target: /downloads
        bind:
          propagation: rslave
      - type: bind
        source: ${MEDIA_ROOT}
        target: /media
        bind:
          propagation: rslave
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  sabnzbd:
    image: linuxserver/sabnzbd:latest
    container_name: sabnzbd
    mem_limit: 256m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
    volumes:
      - ${CONFIG_ROOT}/sabnzbd:/config
      - type: bind
        source: ${DOWNLOADS_ROOT}
        target: /downloads
        bind:
          propagation: rslave
      - type: bind
        source: ${MEDIA_ROOT}
        target: /media
        bind:
          propagation: rslave
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7777/api?mode=version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    mem_limit: 384m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
    ports:
      - "${RADARR_PORT}:7878"
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - type: bind
        source: ${DOWNLOADS_ROOT}
        target: /downloads
        bind:
          propagation: rslave
      - type: bind
        source: ${MEDIA_ROOT}/movies
        target: /movies
        bind:
          propagation: rslave
      - type: bind
        source: ${MEDIA_ROOT}
        target: /media
        bind:
          propagation: rslave
      - /srv/docker/resolv.conf:/etc/resolv.conf:ro
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      sabnzbd:
        condition: service_healthy
    healthcheck:
      # Root endpoint returns 200/302 prior to API key setup
      test: ["CMD", "curl", "-f", "http://localhost:7878/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    mem_limit: 512m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
    ports:
      - "${SONARR_PORT}:8989"
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - type: bind
        source: ${DOWNLOADS_ROOT}
        target: /downloads
        bind:
          propagation: rslave
      - type: bind
        source: ${MEDIA_ROOT}/tv
        target: /tv
        bind:
          propagation: rslave
      - type: bind
        source: ${MEDIA_ROOT}
        target: /media
        bind:
          propagation: rslave
      - /srv/docker/resolv.conf:/etc/resolv.conf:ro
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      sabnzbd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  lidarr:
    image: linuxserver/lidarr:latest
    container_name: lidarr
    hostname: lidarr
    mem_limit: 256m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
    ports:
      - "${LIDARR_PORT}:8686"
    volumes:
      - ${CONFIG_ROOT}/lidarr:/config
      - type: bind
        source: ${DOWNLOADS_ROOT}
        target: /downloads
        bind:
          propagation: rslave
      - type: bind
        source: ${MEDIA_ROOT}/music
        target: /music
        bind:
          propagation: rslave
      - type: bind
        source: ${MEDIA_ROOT}
        target: /media
        bind:
          propagation: rslave
      - /srv/docker/resolv.conf:/etc/resolv.conf:ro
    restart: unless-stopped
    depends_on:
      prowlarr:
        condition: service_healthy
      qbittorrent:
        condition: service_healthy
      sabnzbd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8686/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    mem_limit: 384m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
    ports:
      - "${BAZARR_PORT}:6767"
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - type: bind
        source: ${MEDIA_ROOT}/movies
        target: /movies
        bind:
          propagation: rslave
      - type: bind
        source: ${MEDIA_ROOT}/tv
        target: /tv
        bind:
          propagation: rslave
      - type: bind
        source: ${MEDIA_ROOT}
        target: /media
        bind:
          propagation: rslave
      - /srv/docker/resolv.conf:/etc/resolv.conf:ro
    restart: unless-stopped
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6767/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    hostname: seerr
    mem_limit: 384m
    init: true
    ports:
      - "${SEERR_PORT:-5055}:5055"
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
      - /srv/docker/resolv.conf:/etc/resolv.conf:ro
    environment:
      - TZ=${TZ}
    depends_on:
      radarr:
        condition: service_healthy
      sonarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:5055/api/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  tautulli:
    image: linuxserver/tautulli:latest
    container_name: tautulli
    hostname: tautulli
    mem_limit: 256m
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=${UMASK}
    ports:
      - "${TAUTULLI_PORT}:8181"
    volumes:
      - ${CONFIG_ROOT}/tautulli:/config
      - /srv/docker/resolv.conf:/etc/resolv.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    hostname: watchtower
    mem_limit: 64m
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * * # Daily at 4 AM
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  watchtower-weekly:
    image: nickfedor/watchtower:latest
    container_name: watchtower-weekly
    hostname: watchtower-weekly
    mem_limit: 64m
    environment:
      - TZ=${TZ}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * 1 # Weekly on Monday at 4 AM
      - WATCHTOWER_SCOPE=weekly
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=${WATCHTOWER_NOTIFICATION_URL:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    mem_limit: 32m
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

secrets:
  wireguard_private_key:
    file: ./secrets/wireguard_private_key
  wireguard_addresses:
    file: ./secrets/wireguard_addresses

# Using default bridge network - no custom network definition needed
# Docker will automatically create internal DNS for container-to-container communication
# External access via host ports as defined above
