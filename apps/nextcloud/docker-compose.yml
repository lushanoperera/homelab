services:
  nextcloud-db:
    image: postgres:17-alpine
    container_name: nextcloud-db
    mem_limit: 256m
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud_database}
    volumes:
      - nextcloud-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextcloud} -d ${POSTGRES_DB:-nextcloud_database}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nextcloud-app:
    build:
      context: .
      args:
        NEXTCLOUD_VERSION: ${NEXTCLOUD_VERSION:-33}
    image: nextcloud-custom:${NEXTCLOUD_VERSION:-33}-fpm
    container_name: nextcloud-app
    mem_limit: 512m
    restart: unless-stopped
    environment:
      POSTGRES_HOST: nextcloud-db
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud_database}
      REDIS_HOST: nextcloud-redis
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-nextcloud.home.disconnesso.com nextcloud.lushanoperera.com nextcloud.giulyart.it}
      NEXTCLOUD_DATA_DIR: /var/www/html/data
      OVERWRITEPROTOCOL: https
      TRUSTED_PROXIES: 192.168.100.100 192.168.7.119 172.16.0.0/12
      NC_default_phone_region: IT
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - /mnt/ncdata:/var/www/html/data
      - nextcloud-app:/var/www/html
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
      - /dev/dri/card0:/dev/dri/card0
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy

  nextcloud-web:
    image: nginx:alpine
    container_name: nextcloud-web
    mem_limit: 64m
    restart: unless-stopped
    ports:
      - "192.168.100.101:11000:80"
    volumes:
      - nextcloud-app:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - default
      - traefik_internal
    depends_on:
      - nextcloud-app

  nextcloud-cron:
    image: nextcloud-custom:${NEXTCLOUD_VERSION:-33}-fpm
    container_name: nextcloud-cron
    mem_limit: 256m
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - /mnt/ncdata:/var/www/html/data
      - nextcloud-app:/var/www/html
    depends_on:
      - nextcloud-app

  nextcloud-imaginary:
    image: nextcloud/aio-imaginary:latest
    container_name: nextcloud-imaginary
    mem_limit: 512m
    restart: unless-stopped
    cap_add:
      - SYS_NICE

  nextcloud-docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: nextcloud-docker-proxy
    mem_limit: 32m
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      POST: 1

  appapi-harp:
    image: ghcr.io/nextcloud/nextcloud-appapi-harp:release
    container_name: appapi-harp
    mem_limit: 128m
    restart: unless-stopped
    environment:
      HP_SHARED_KEY: ${HARP_SHARED_KEY:-zxi9gSrZevgz9e8re951f7qa8OeUE5Ht}
      NC_INSTANCE_URL: http://nextcloud-web:80
      HP_LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nextcloud-web

volumes:
  nextcloud-db:
    driver: local
  nextcloud-app:
    driver: local

networks:
  traefik_internal:
    external: true
