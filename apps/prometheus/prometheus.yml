# Prometheus config for homelab observability backend.
#
# Remote-write ingestion is enabled via the CLI flag
# `--web.enable-remote-write-receiver` in docker-compose.yml (NOT via this file).
# The blog-publisher otel-collector on flatcar-nwdesigns VM 104 pushes
# Claude Code OTEL metrics to http://192.168.100.100:9090/api/v1/write.
#
# Scrape configs below are intentionally minimal — the primary ingestion
# path for this backend is remote_write. Add scrape targets here if/when
# we pull metrics directly from future services.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: homelab
    host: flatcar-media

scrape_configs:
  # Self-scrape so Prometheus exposes its own internal metrics.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Placeholder for future scrape jobs (node_exporter, cadvisor, etc.).
