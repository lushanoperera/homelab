# Immich is EXCLUDED from Watchtower auto-updates (2026-09-11).
#
# The server lives here on VM 100 and the machine-learning service lives in LXC 107 on
# winston (apps/immich-ml/). Immich requires both to run the SAME version, and the VM 100
# Watchtower cannot see or update the LXC 107 container. An unattended server bump would
# therefore leave server and ML on different versions.
#
# It also removes the nightly GHCR poll that failed on 2026-09-11 04:00 UTC with
# "registry rate limited ... allowed 44000 per 1m0s" on ghcr.io/immich-app/immich-server.
#
# Upgrade procedure (manual, both hosts, same version):
#   1. docker pull the server image on VM 100 AND the -openvino ML image in LXC 107
#   2. set IMMICH_VERSION=vX.Y.Z in /srv/docker/immich/.env and /srv/docker/immich-ml/.env
#   3. /opt/bin/docker-compose up -d here, then docker compose up -d in LXC 107
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    container_name: immich_server
    mem_limit: 1g
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "192.168.100.103:2283:2283"
    environment:
      DB_HOSTNAME: immich_postgres
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME:-immich}
      REDIS_HOSTNAME: immich_redis
      # ML runs in LXC 107 on winston (apps/immich-ml/) — no GPU on VM 100 anymore
      IMMICH_MACHINE_LEARNING_URL: ${IMMICH_MACHINE_LEARNING_URL:-http://192.168.100.107:3003}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - /mnt/immich/upload:/data
    networks:
      - default
      - traefik_internal
    depends_on:
      immich_redis:
        condition: service_healthy
      immich_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2283/api/server/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  immich_redis:
    image: docker.io/valkey/valkey:9@sha256:3eeb09785cd61ec8e3be35f8804c8892080f3ca21934d628abc24ee4ed1698f6
    container_name: immich_redis
    mem_limit: 128m
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  immich_postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    user: "999:999"
    mem_limit: 512m
    restart: unless-stopped
    shm_size: 128mb
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_DB: ${DB_DATABASE_NAME:-immich}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /mnt/immich/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_DATABASE_NAME:-immich} -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  traefik_internal:
    external: true
