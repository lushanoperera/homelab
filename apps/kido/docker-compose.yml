services:
  postgres:
    image: postgres:15-alpine
    container_name: kido-db
    mem_limit: 128m
    environment:
      POSTGRES_DB: kido
      POSTGRES_USER: kido_user
      POSTGRES_PASSWORD: kido_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kido-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kido_user -d kido"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kido-redis
    mem_limit: 64m
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - kido-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kido-backend
    mem_limit: 192m
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kido_user:kido_password@postgres:5432/kido
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-secret-jwt-key-change-in-production
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_logs:/app/logs
    networks:
      - kido-network
    command: bun run start
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kido-frontend
    mem_limit: 64m
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - kido-network
    command: bun run dev --host

volumes:
  postgres_data:
  redis_data:
  backend_logs:

networks:
  kido-network:
    driver: bridge
