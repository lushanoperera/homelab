services:
  couchdb:
    image: couchdb:3
    container_name: couchdb
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
    volumes:
      - /srv/docker/couchdb/data:/opt/couchdb/data
      - ./config/local.ini:/opt/couchdb/etc/local.d/local.ini:ro
    ports:
      - "5984:5984"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "-u", "${COUCHDB_USER}:${COUCHDB_PASSWORD}", "http://localhost:5984/_up"]
      interval: 30s
      timeout: 10s
      retries: 3
