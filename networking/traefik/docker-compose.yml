version: "3.9"

services:
  traefik:
    image: traefik:v3.3
    container_name: traefik
    mem_limit: 192m
    restart: unless-stopped
    networks:
      dmz_macvlan:
        ipv4_address: 192.168.7.119
      traefik_internal:
        aliases:
          - traefik
    command:
      - "--api=true"
      - "--api.dashboard=true"
      - "--providers.docker=false"
      - "--providers.file.directory=/etc/traefik"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.traefik.address=:8080"
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/access.log"
      - "--entrypoints.websecure.http.tls=true"
      - "--log.level=INFO"
      - "--ping=true"
    volumes:
      - ./acme.json:/acme.json
      - ./services.yml:/etc/traefik/services.yml:ro
      - ./nextcloud-dynamic.toml:/etc/traefik/nextcloud-dynamic.toml:ro
      - ./tls.toml:/etc/traefik/tls.toml:ro
      - ./logs:/logs
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    mem_limit: 256m
    restart: unless-stopped
    networks:
      traefik_internal:
        aliases:
          - crowdsec
    environment:
      - GID=1000
      - COLLECTIONS=crowdsecurity/traefik crowdsecurity/http-cve
    volumes:
      - ../crowdsec/db:/var/lib/crowdsec/data
      - ../crowdsec/config:/etc/crowdsec
      - ../crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml
      - ./logs:/logs:ro
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  crowdsec-bouncer:
    image: ghcr.io/thespad/traefik-crowdsec-bouncer:latest
    container_name: crowdsec-bouncer
    mem_limit: 64m
    restart: unless-stopped
    networks:
      traefik_internal:
        aliases:
          - bouncer
    environment:
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY}
      - CROWDSEC_AGENT_HOST=crowdsec:8080
      - GIN_MODE=release
      - PORT=8082
      - CROWDSEC_BOUNCER_LOG_LEVEL=1
    depends_on:
      crowdsec:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    mem_limit: 128m
    restart: unless-stopped
    networks:
      traefik_internal:
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      - NO_TLS_VERIFY=true
    command: tunnel run
    volumes:
      - ./certs:/certs:ro

networks:
  dmz_macvlan:
    external: true
  traefik_internal:
    external: true
