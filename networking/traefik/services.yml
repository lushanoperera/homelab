http:
  routers:
    # Traefik Dashboard with authentication
    dashboard:
      rule: "Host(`traefik.lushanoperera.com`)"
      service: "api@internal"
      entryPoints:
        - traefik
      middlewares:
        - crowdsec-bouncer
        - dashboard-auth

    # Immich - HTTPS direct access
    immich:
      rule: "Host(`immich.lushanoperera.com`) || Host(`immich.giulyart.it`)"
      service: "immich-service"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - security-headers
        - rate-limit
        - crowdsec-bouncer

    # Immich - HTTP (for Cloudflare Tunnel)
    immich-http:
      rule: "Host(`immich.lushanoperera.com`) || Host(`immich.giulyart.it`)"
      service: "immich-service"
      entryPoints:
        - web
      middlewares:
        - security-headers
        - rate-limit
        - crowdsec-bouncer

    # Nextcloud - HTTPS direct access
    nextcloud:
      rule: "Host(`nextcloud.lushanoperera.com`) || Host(`nextcloud.giulyart.it`)"
      service: "nextcloud-service"
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - nextcloud-headers
        - rate-limit
        - crowdsec-bouncer

    # Nextcloud - HTTP (for Cloudflare Tunnel)
    nextcloud-http:
      rule: "Host(`nextcloud.lushanoperera.com`) || Host(`nextcloud.giulyart.it`)"
      service: "nextcloud-service"
      entryPoints:
        - web
      middlewares:
        - nextcloud-headers
        - rate-limit
        - crowdsec-bouncer

  services:
    immich-service:
      loadBalancer:
        servers:
          - url: "http://immich_server:2283"
    nextcloud-service:
      loadBalancer:
        servers:
          - url: "http://nextcloud-web:80"
  middlewares:
    # Dashboard BasicAuth
    dashboard-auth:
      basicAuth:
        users:
          - "admin:$2y$05$Uxd1gXQW3GLdcaGWn3xKdexkdPs09bsekA02aGQktG55O8eBqeLAC"

    # Rate limiting
    rate-limit:
      rateLimit:
        average: 100
        burst: 50

    # Security headers
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"

    # Nextcloud needs SAMEORIGIN (not DENY) for internal iframes
    nextcloud-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        customFrameOptionsValue: "SAMEORIGIN"
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Robots-Tag: "noindex, nofollow"

    # CrowdSec bouncer
    crowdsec-bouncer:
      forwardAuth:
        address: "http://bouncer:8082/api/v1/forwardAuth"
        trustForwardHeader: true
