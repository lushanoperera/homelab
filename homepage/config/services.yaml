- Applications:
    - Nextcloud:
        icon: nextcloud.png
        href: https://nextcloud.home.disconnesso.com
        description: Cloud storage
        server: my-docker
        container: nextcloud-app
        widget:
          type: nextcloud
          url: http://192.168.100.101:11000
          username: "{{HOMEPAGE_VAR_NEXTCLOUD_USER}}"
          password: "{{HOMEPAGE_VAR_NEXTCLOUD_PASS}}"
    - Immich:
        icon: immich.png
        href: https://immich.home.disconnesso.com
        description: Photo management
        server: my-docker
        container: immich_server
        widget:
          type: customapi
          url: http://192.168.100.103:2283/api/server/statistics
          headers:
            x-api-key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          mappings:
            - field: photos
              label: Photos
              format: number
            - field: videos
              label: Videos
              format: number
            - field: usage
              label: Storage
              format: bytes
    - Home Assistant:
        icon: home-assistant.png
        href: https://homeassistant.home.disconnesso.com
        description: Smart home
        widget:
          type: homeassistant
          url: http://192.168.100.102:8123
          key: "{{HOMEPAGE_VAR_HA_KEY}}"
    - Vaultwarden:
        icon: vaultwarden.png
        href: https://vaultwarden.home.disconnesso.com
        description: Password manager
        server: my-docker
        container: vaultwarden
    - Obsidian Sync:
        icon: obsidian.png
        href: https://obsidian-sync.home.disconnesso.com
        description: CouchDB LiveSync
        server: my-docker
        container: couchdb
        ping: http://192.168.100.100:5984/_up
        widget:
          type: customapi
          url: http://192.168.100.100:5984/obsidian-livesync
          username: "{{HOMEPAGE_VAR_COUCHDB_USER}}"
          password: "{{HOMEPAGE_VAR_COUCHDB_PASS}}"
          refreshInterval: 30000
          mappings:
            - field: doc_count
              label: Docs
              format: number
            - field:
                sizes: file
              label: Size
              format: bytes
            - field: compact_running
              label: Compacting
              format: text
    - Portainer:
        icon: portainer.png
        href: https://portainer.home.disconnesso.com
        description: Container management
        server: my-docker
        container: portainer
        widget:
          type: portainer
          url: https://localhost:9443
          env: 3
          key: "{{HOMEPAGE_VAR_PORTAINER_KEY}}"
    - Forgejo:
        icon: forgejo.png
        href: https://forgejo.home.disconnesso.com
        description: Private Git server
        server: my-docker
        container: forgejo

