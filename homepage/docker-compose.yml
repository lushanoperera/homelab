services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    network_mode: host
    environment:
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      TZ: ${TZ:-Europe/Rome}
      HOMEPAGE_ALLOWED_HOSTS: homepage.home.disconnesso.com
      # Widget API keys (referenced as {{HOMEPAGE_VAR_*}} in services.yaml)
      HOMEPAGE_VAR_SONARR_KEY: ${SONARR_API_KEY}
      HOMEPAGE_VAR_RADARR_KEY: ${RADARR_API_KEY}
      HOMEPAGE_VAR_LIDARR_KEY: ${LIDARR_API_KEY}
      HOMEPAGE_VAR_BAZARR_KEY: ${BAZARR_API_KEY}
      HOMEPAGE_VAR_PROWLARR_KEY: ${PROWLARR_API_KEY}
      HOMEPAGE_VAR_QBIT_PASS: ${QBITTORRENT_PASSWORD}
      HOMEPAGE_VAR_SABNZBD_KEY: ${SABNZBD_API_KEY}
      HOMEPAGE_VAR_TAUTULLI_KEY: ${TAUTULLI_API_KEY}
      HOMEPAGE_VAR_SEERR_KEY: ${SEERR_API_KEY}
      HOMEPAGE_VAR_PROFILARR_KEY: ${PROFILARR_API_KEY}
      HOMEPAGE_VAR_NEXTCLOUD_USER: ${NEXTCLOUD_USER}
      HOMEPAGE_VAR_NEXTCLOUD_PASS: ${NEXTCLOUD_PASSWORD}
      HOMEPAGE_VAR_COUCHDB_USER: ${COUCHDB_USER}
      HOMEPAGE_VAR_COUCHDB_PASS: ${COUCHDB_PASSWORD}
      HOMEPAGE_VAR_IMMICH_KEY: ${IMMICH_API_KEY}
      HOMEPAGE_VAR_HA_KEY: ${HOMEASSISTANT_API_KEY}
      HOMEPAGE_VAR_PORTAINER_KEY: ${PORTAINER_API_KEY}
      HOMEPAGE_VAR_PLEX_KEY: ${PLEX_API_KEY}
      HOMEPAGE_VAR_PROXMOX_TOKEN_ID: ${PROXMOX_TOKEN_ID}
      HOMEPAGE_VAR_PROXMOX_WINSTON_SECRET: ${PROXMOX_WINSTON_SECRET}
      HOMEPAGE_VAR_PROXMOX_REGINALD_SECRET: ${PROXMOX_REGINALD_SECRET}
    security_opt:
      - label:disable
    group_add:
      - "233"
    volumes:
      - ./config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/docker/resolv.conf:/etc/resolv.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
